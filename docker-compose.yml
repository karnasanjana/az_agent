# Deploys the APP itself (not the ADF pipelines). The app then connects to Azure
# on /approve using DefaultAzureCredential (Managed Identity or service principal).
#
#   docker compose up --build
#
# Set real values in a .env file next to this compose file (see README). For an
# Azure-free local dry-run, set MOCK=true.

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # --- Foundry / Claude (required for /plan) ---
      FOUNDRY_BASE_URL: ${FOUNDRY_BASE_URL}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-8}

      # --- Azure (required for /approve unless MOCK=true) ---
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:-}
      ADF_FACTORY_NAME: ${ADF_FACTORY_NAME:-}
      ADLS_ACCOUNT_NAME: ${ADLS_ACCOUNT_NAME:-}
      ADLS_ACCOUNT_URL: ${ADLS_ACCOUNT_URL:-}
      AZURE_LOCATION: ${AZURE_LOCATION:-eastus}

      # --- Service principal (omit when using Managed Identity) ---
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}

      # --- Feature flags ---
      MOCK: ${MOCK:-false}            # true = local dry-run, no Azure writes
      SELF_HEAL: ${SELF_HEAL:-false}  # true = enable Claude self-heal retry loop
    volumes:
      - ./artifacts:/app/artifacts
      - ./mock_tenant:/app/mock_tenant
