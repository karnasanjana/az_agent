# Deploys the APP itself (not the ADF pipelines). The app then connects to Azure
# on /approve using DefaultAzureCredential (Managed Identity or service principal).
#
#   docker compose up --build
#
# Set real values in a .env file next to this compose file (see README). For an
# Azure-free local dry-run, set MOCK=true.

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # --- Foundry / Claude (required for /plan) ---
      FOUNDRY_BASE_URL: ${FOUNDRY_BASE_URL}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-8}

      # --- Azure (required for /approve unless MOCK=true) ---
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:-}
      ADF_FACTORY_NAME: ${ADF_FACTORY_NAME:-}
      ADLS_ACCOUNT_NAME: ${ADLS_ACCOUNT_NAME:-}
      ADLS_ACCOUNT_URL: ${ADLS_ACCOUNT_URL:-}
      AZURE_LOCATION: ${AZURE_LOCATION:-eastus}

      # --- Service principal (omit when using Managed Identity) ---
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}

      # --- Feature flags ---
      MOCK: ${MOCK:-false}            # true = local dry-run, no Azure writes
      SELF_HEAL: ${SELF_HEAL:-false}  # true = enable Claude self-heal retry loop

      # --- ER-Diagram catalog seam (grounds pipelines on the reviewed diagram) ---
      ER_CATALOG_URL: ${ER_CATALOG_URL:-http://er-backend:8080/api}
    volumes:
      - ./artifacts:/app/artifacts
      - ./mock_tenant:/app/mock_tenant
    depends_on:
      - er-backend

  # ER-Diagram backend: extracts + serves the reviewed schema catalog (:8010).
  er-backend:
    build: ./ER-Diagram/backend
    ports:
      - "8010:8080"
    environment:
      FERNET_KEY: ${FERNET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Diagram storage is GCS-backed — mount a service-account key and point at it.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
      GCS_BUCKET: ${GCS_BUCKET:-erdiagram}
      GCS_PROJECT: ${GCS_PROJECT:-gemini-for-zion}
    volumes:
      - ${GCP_SA_KEY_FILE:-./gcp-sa.json}:/secrets/gcp-sa.json:ro

  # ER-Diagram frontend (Next.js UI, :3000). NEXT_PUBLIC_API_URL is baked at build.
  er-frontend:
    build:
      context: ./ER-Diagram/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    ports:
      - "3000:3000"
    depends_on:
      - er-backend
